name: Upstream Sync

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lennox branch
        uses: actions/checkout@v4
        with:
          ref: lennox
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Fission-AI/openspec.git || true
          git fetch upstream main

      - name: Attempt merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="upstream-sync/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"

          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

            # Only push if there are actual changes
            if git diff --quiet lennox; then
              echo "changes=false" >> "$GITHUB_OUTPUT"
            else
              git push origin "$BRANCH"
              echo "changes=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

            # Abort merge, push conflicting state info
            git merge --abort
          fi

      - name: Create PR (clean merge)
        if: steps.merge.outputs.conflict == 'false' && steps.merge.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base lennox \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: upstream sync $(date +%Y-%m-%d)" \
            --body "Automated upstream sync from \`fission-ai/openspec:main\`.

          **Clean merge** — no conflicts detected.

          Please review and merge when ready." \
            --label "upstream-sync"

      - name: Create issue (conflicts)
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream sync conflict — $(date +%Y-%m-%d)" \
            --body "Weekly upstream sync from \`fission-ai/openspec:main\` has merge conflicts.

          **Manual resolution required.** See [lennox/UPSTREAM-SYNC.md](lennox/UPSTREAM-SYNC.md) for the conflict resolution protocol.

          Modified files likely in conflict:
          - \`package.json\`
          - \`src/core/init.ts\`
          - \`src/core/change-metadata/schema.ts\`
          - \`src/core/templates/workflows/verify-change.ts\`
          - \`src/cli/index.ts\`

          \`\`\`bash
          git fetch upstream main
          git checkout lennox
          git merge upstream/main
          # Resolve conflicts, then:
          pnpm test
          openspec schema validate sdd-spec-driven
          git commit
          \`\`\`" \
            --label "upstream-sync"

      - name: No changes
        if: steps.merge.outputs.changes == 'false'
        run: echo "Already up to date with upstream. No PR needed."
